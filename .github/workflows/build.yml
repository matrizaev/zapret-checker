name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        target:
          - all
          - dev
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential pkg-config xxd \
            libcurl4-openssl-dev libidn2-dev libnetfilter-queue-dev \
            libxml2-dev libzip-dev
      - name: Build all binaries
        run: make "${{ matrix.target }}"
      - name: Check build outputs
        run: |
          test -x zapret-checker
          test -x zapret-download
          test -x rutoken-sign

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential pkg-config xxd \
            libcurl4-openssl-dev libidn2-dev libnetfilter-queue-dev \
            libxml2-dev libzip-dev
      - name: Build all binaries with sanitizers
        run: make sanitize
      - name: Check build outputs
        run: |
          test -x zapret-checker
          test -x zapret-download
          test -x rutoken-sign
